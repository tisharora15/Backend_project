
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resin Art Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Resin Art Shop - by Artistic Tisha✨</h1>
        <p>Handmade products made with love!</p>
        <button id="cartButton">
            My Cart (<span id="cartCount">0</span>)
        </button>
    </header>

    <main>
        <h2>Find Your Favourite Resin Art 💗</h2>

        <section class="controls">
            <input type="text" id="searchInput"
                   placeholder="Search products...">

            <select id="categoryFilter">
                <option value="all">All Products</option>
                <option value="Frames">Frames</option>
                <option value="Keychains">Keychains</option>
                <option value="Earrings">Earrings</option>
                <option value="Bracelets">Bracelets</option>
                <option value="Clocks">Resin Clocks</option>
            </select>

            <select id="sortSelect">
                <option value="default">Default Sorting</option>
                <option value="low">Price: Low to High</option>
                <option value="high">Price: High to Low</option>
                <option value="name">Name: A to Z</option>
            </select>
        </section>

        <h2>Our Products</h2>
        <section id="productList" class="product-grid"></section>

        <section id="cartSection" class="cart-section">
            <h2> Your Shopping Cart</h2>

            <div id="cartItems"></div>

            <div class="coupon">
                <h3>Have a coupon?</h3>
                <input type="text" id="couponInput"
                       placeholder="Enter SAVE10">
                <button id="applyCoupon">Apply Coupon</button>
                <p id="couponMessage"></p>
            </div>

            <div class="bill">
                <p>
                    Subtotal:
                    <span id="subtotal">₹0.00</span>
                </p>

                <p>
                    Discount:
                    <span id="discount">₹0.00</span>
                </p>

                <h3>
                    Total:
                    <span id="total">₹0.00</span>
                </h3>

                <button id="checkoutButton" class="checkout">
                    Proceed to Checkout
                </button>
            </div>
        </section>
    </main>

    <footer>
        <p>Resin Art Shop | Made with love 💕</p>
        
    </footer>

    <script src="script.js"></script>
</body>
</html>
